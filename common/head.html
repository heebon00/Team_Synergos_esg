<link rel="stylesheet" href="./assets/fonts/pretendard.css">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<style type="text/tailwindcss">
  @theme {
    --color-divider: #d9d9d9;
    --color-brand-dark: #003d8f;

    --radius-pill:   20px;

    --spacing-container: 1280px;
    --spacing-card-img:  200px;
    --spacing-card-min:  340px;
    --spacing-hero-img:  260px;
    --spacing-header-nav: 72px;
    --spacing-logo:      98px;
    --spacing-search:    320px;

    --color-ink:     #111418;
    --color-ink-2:   #3d4450;
    --color-ink-3:   #6b7280;
    --color-muted:   #666666;
    --color-line:    #c5ccd6;
    --color-line-2:  #d1d5db;
    --color-hair:    #f0f0f0;
    --color-shell:   #f8f9fa;
    --color-brand:   #0051ba;
    --color-navy:    #1e3a8a;
    --color-price:   #1a1a1a;
    --color-crust:   #f5f5f5;
    --color-slate-ink: #111827;
  }

  @layer base {
    body {
      font-family: Pretendard, "Pretendard Variable", -apple-system, BlinkMacSystemFont,
                   "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      text-size-adjust: 100%;
    }
    :focus-visible {
      outline: 3px solid var(--color-brand);
      outline-offset: 2px;
      border-radius: 4px;
    }
    img { max-width: 100%; }
  }

  /* 화면에서만 감추고 스크린리더에는 남기는 텍스트 */
  .hide {
    position: absolute;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
    border: 0;
  }

  /* 스크롤 등장 요소: JS가 살아있고 모션 허용일 때만 감춘다 */
  .rv { opacity: 1 !important; transform: none !important; }

  /* Swiper 커스텀 */
  .swiper-slide { height: auto; }
  .cat-sw .swiper-slide { width: 80px; }
  /* 카드가 떠오를 때 그림자가 잘리지 않도록 여백 확보 */
  .prod-sw { padding: 10px 2px 26px; }
  .nav-btn[aria-disabled="true"] { opacity: .3; }

  /* 건너뛰기 링크 */
  .skip {
    position: absolute; left: 16px; top: -80px; z-index: 100;
    background: var(--color-white); color: var(--color-brand);
    border: 2px solid var(--color-brand); border-radius: 8px;
    padding: 12px 20px; font-weight: 700;
    transition: top .15s ease-out;
  }
  .skip:focus { top: 16px; }
</style>
